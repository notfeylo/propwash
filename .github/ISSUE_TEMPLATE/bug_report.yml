name: Bug report
description: Something looks, sounds, or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser, OS, and GPU
      placeholder: Chrome 140 / Windows 11 / RTX 3060
    validations:
      required: true
  - type: input
    id: input-device
    attributes:
      label: Input device (if relevant)
      placeholder: PS5 DualSense, Radiomaster TX16S, keyboard...
  - type: textarea
    id: console
    attributes:
      label: Console errors or screenshots
